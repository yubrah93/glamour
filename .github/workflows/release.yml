name: goreleaser

on:
  push:
    tags:
      - v*.*.*

concurrency:
  group: goreleaser
  cancel-in-progress: true

jobs:
  rollouts-start:
    runs-on: ubuntu-latest
    outputs:
      deployment: ${{ steps.report.outputs.deployment }}
      already_completed: ${{ steps.report.outputs.already_completed }}
    steps:
      - name: Checkout Rollouts reporter
        uses: actions/checkout@v4
      - name: Report Rollouts deployment start
        id: report
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "goreleaser"
          CHANGE_MONITOR_SERVICE: "glamour"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.workflow }}:goreleaser:glamour:goreleaser"
        run: |
          export DEPLOY_VERSION="$(git rev-parse HEAD)"
          bash .github/scripts/rollouts-reporter.sh bootstrap
          bash .github/scripts/rollouts-reporter.sh start
  goreleaser:
    needs: rollouts-start
    uses: charmbracelet/meta/.github/workflows/goreleaser.yml@main
    secrets:
      docker_username: ${{ secrets.DOCKERHUB_USERNAME }}
      docker_token: ${{ secrets.DOCKERHUB_TOKEN }}
      gh_pat: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      goreleaser_key: ${{ secrets.GORELEASER_KEY }}
      twitter_consumer_key: ${{ secrets.TWITTER_CONSUMER_KEY }}
      twitter_consumer_secret: ${{ secrets.TWITTER_CONSUMER_SECRET }}
      twitter_access_token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      twitter_access_token_secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      mastodon_client_id: ${{ secrets.MASTODON_CLIENT_ID }}
      mastodon_client_secret: ${{ secrets.MASTODON_CLIENT_SECRET }}
      mastodon_access_token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      discord_webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
      discord_webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

  rollouts-finish:
    needs: [rollouts-start, goreleaser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rollouts reporter
        uses: actions/checkout@v4
      - name: Report Rollouts deployment finish
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "goreleaser"
          CHANGE_MONITOR_SERVICE: "glamour"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.workflow }}:goreleaser:glamour:goreleaser"
          CHANGE_MONITOR_OUTCOME: ${{ needs.goreleaser.result }}
          ROLLOUTS_DEPLOYMENT: ${{ needs.rollouts-start.outputs.deployment }}
          ROLLOUTS_ALREADY_COMPLETED: ${{ needs.rollouts-start.outputs.already_completed }}
        run: bash .github/scripts/rollouts-reporter.sh finish
